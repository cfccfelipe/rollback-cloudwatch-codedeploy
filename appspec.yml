version: 0.0
os: linux
files:
  - source: /
    destination: /home/ec2-user/cmtr-app
    overwrite: true
permissions:
  - object: /home/ec2-user/cmtr-app/scripts
    pattern: "*.sh"
    owner: ec2-user
    group: ec2-user
    mode: 755
    type:
      - file
hooks:
  BeforeInstall:
    - location: scripts/stop_application.sh
      timeout: 120
      runas: root
  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start_application.sh
      timeout: 120
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 120
      runas: root
  AfterAllowTraffic:
    - location: scripts/hold_for_alarm.sh
      timeout: 600
      runas: root
